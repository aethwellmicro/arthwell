<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 120 120" style="enable-background:new 0 0 120 120;" xml:space="preserve">
<defs>
  <linearGradient id="aw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#059669"/>
    <stop offset="100%" style="stop-color:#0d9488"/>
  </linearGradient>
</defs>
<!-- Rounded square background -->
<rect x="10" y="10" width="100" height="100" rx="24" fill="url(#aw-grad)"/>
<!-- Letter A stylized as a mountain/peak representing growth -->
<g>
  <!-- A shape -->
  <path d="M60 28 L82 82 L70 82 L60 58 L50 82 L38 82 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Inner cut for A -->
  <path d="M55 68 L65 68 L60 52 Z" fill="url(#aw-grad)"/>
</g>
<!-- Coin/circle accent at bottom right -->
<circle cx="84" cy="84" r="14" fill="#FFFFFF" opacity="0.2"/>
<circle cx="84" cy="84" r="8" fill="#FFFFFF" opacity="0.4"/>
</svg>
